# Rehab RCH Agent v4 — 24/7 container deployment (alternative to systemd).
# Usage on any server with Docker:
#   cp .env.example .env   # fill secrets (TELEGRAM_BOT_TOKEN, GEMINI_API_KEY, ...)
#   docker compose up -d --build
#   docker compose logs -f
services:
  rehab-agent:
    build: .
    container_name: rehab-rch-agent
    restart: always
    env_file: .env
    environment:
      TZ: Asia/Riyadh
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./knowledge:/app/knowledge:ro
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c", "import time,os; assert time.time()-os.stat('/app/output/heartbeat.txt').st_mtime < 300"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 2m
